openapi: 3.0.0
info:
  title: parameter-ref-schema-ref
  version: '1.0'

paths:
  /referenced/{kind}:
    get:
      operationId: getReferencedParam
      parameters:
        - $ref: '#/components/parameters/kind'
        - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: ok

  /inline/{kind}:
    get:
      operationId: getInlineParam
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            $ref: '#/components/schemas/Kind'
        - in: query
          name: filter
          required: false
          schema:
            $ref: '#/components/schemas/Kind'
      responses:
        '200':
          description: ok

components:
  parameters:
    kind:
      in: path
      name: kind
      required: true
      schema:
        $ref: '#/components/schemas/Kind'
    filter:
      in: query
      name: filter
      required: false
      schema:
        $ref: '#/components/schemas/Kind'

  schemas:
    Kind:
      type: string
      enum: [alpha, beta, gamma]
